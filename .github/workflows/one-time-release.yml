name: Publish verified v1.1.0

on:
  push:
    paths:
      - '.github/workflows/one-time-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: '34978605803'
      VERIFIED_COMMIT: 'f4083cd6003f6a128c73398736a54a48af98f327'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact artifact produced by green Windows CI
        run: |
          mkdir -p release
          gh run download "$VERIFIED_RUN" -n codex-smart-factory-verified-windows -D release
          ls -la release

      - name: Publish GitHub Release
        run: |
          cat > release-notes.md <<'EOF'
          # Astra AGI Harness for Codex — Smart Factory v1.1.0

          Windows-first release for **Codex Windows app + Codex CLI**.

          This release combines one persistent workflow for long-horizon Codex work:

          - full global always-on Core while preserving user/project AGENTS rules;
          - automatic old/new project discovery;
          - Unified Mission Control with task DAG, per-task Markdown, progress/findings and deterministic `RESUME-FROM-HERE.md`;
          - discovered bugs/work become linked blocker/required/related/follow-up/out-of-scope tasks;
          - per-task best model, reasoning effort, reason and actual model used;
          - live-catalog Luna/Terra/Sol/GPT-6 Astra-aware routing when available;
          - context/token discipline and bounded tool output;
          - Codex 5-hour/weekly quota-aware checkpoint/safe-stop behavior with conservative fallback;
          - rollout-backed `Check if you are boosted or no?` verification;
          - safe install/update/repair/uninstall and preservation regression tests.

          **AGI harness does not mean this package creates or unlocks AGI.** It is an orchestration/context-engineering layer around the capabilities Codex already exposes.

          The attached ZIP and checksum are the exact files produced only after the Windows CI parser + regression suite passed.
          EOF

          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 release/Astra-AGI-Harness-Codex-Smart-Factory-v1.1.0.zip release/Astra-AGI-Harness-Codex-Smart-Factory-v1.1.0.zip.sha256 --clobber
          else
            gh release create v1.1.0 \
              release/Astra-AGI-Harness-Codex-Smart-Factory-v1.1.0.zip \
              release/Astra-AGI-Harness-Codex-Smart-Factory-v1.1.0.zip.sha256 \
              --target "$VERIFIED_COMMIT" \
              --title 'v1.1.0 — Astra AGI Harness for Codex Windows' \
              --notes-file release-notes.md
          fi
