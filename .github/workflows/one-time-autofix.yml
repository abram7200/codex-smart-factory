name: One-time autofix

on:
  push:
    paths:
      - '.github/workflows/one-time-autofix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Mission PowerShell 5.1 array handling
        shell: powershell
        run: |
          $path = 'src/mission/Mission.ps1'
          $text = [IO.File]::ReadAllText($path)
          $before = $text
          $text = $text.Replace('$deps=Split-List $DependsOn', '$deps=@(Split-List $DependsOn)')
          $text = $text.Replace('$rel=Split-List $Related', '$rel=@(Split-List $Related)')
          if ($text -eq $before) { throw 'Expected Mission.ps1 patterns were not found; refusing silent no-op.' }
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))
          git config user.name 'codex-smart-factory-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $path
          git commit -m 'fix: preserve array semantics in mission list parsing'
          git push origin HEAD:main
