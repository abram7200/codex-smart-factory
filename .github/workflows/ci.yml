name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Precheck
        shell: powershell
        run: .\PRECHECK.ps1

      - name: Tests
        shell: powershell
        run: .\tests\Run-All.ps1

      - name: Build verified release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $version = (Get-Content -Raw .\VERSION).Trim()
          $name = "Astra-AGI-Harness-Codex-Smart-Factory-v$version"
          $stage = Join-Path $env:RUNNER_TEMP $name
          $zip = Join-Path $env:RUNNER_TEMP ($name + ".zip")
          $shaFile = Join-Path $env:RUNNER_TEMP ($name + ".zip.sha256")

          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($relative in @(git ls-files)) {
            if ([string]::IsNullOrWhiteSpace($relative)) { continue }
            $source = Join-Path $PWD $relative
            $dest = Join-Path $stage $relative
            $parent = Split-Path -Parent $dest
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $source -Destination $dest -Force
          }

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($shaFile, ($hash + "  " + [IO.Path]::GetFileName($zip) + "`n"), (New-Object Text.UTF8Encoding($false)))

          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$shaFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Built verified package: $zip"
          Write-Host "SHA-256: $hash"

      - name: Upload verified release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: codex-smart-factory-verified-windows
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 90
