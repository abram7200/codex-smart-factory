name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify single CMD entrypoint
        shell: cmd
        run: |
          for /f %%N in ('dir /b /a-d *.cmd ^| find /c /v ""') do set COUNT=%%N
          if not "%COUNT%"=="1" (
            echo Expected exactly one root CMD entrypoint, found %COUNT%
            exit /b 1
          )
          if not exist CODEX_SMART_FACTORY.cmd (
            echo CODEX_SMART_FACTORY.cmd missing
            exit /b 1
          )

      - name: Smart CMD self-test
        shell: cmd
        run: CODEX_SMART_FACTORY.cmd --self-test

      - name: Precheck
        shell: powershell
        run: .\PRECHECK.ps1

      - name: Tests
        shell: powershell
        run: .\tests\Run-All.ps1

      - name: Build verified release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $version = (Get-Content -Raw .\VERSION).Trim()
          $name = "Astra-AGI-Harness-Codex-Smart-Factory-v$version"
          $stage = Join-Path $env:RUNNER_TEMP $name
          $zip = Join-Path $env:RUNNER_TEMP ($name + ".zip")
          $shaFile = Join-Path $env:RUNNER_TEMP ($name + ".zip.sha256")

          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($relative in @(git ls-files)) {
            if ([string]::IsNullOrWhiteSpace($relative)) { continue }
            $source = Join-Path $PWD $relative
            $dest = Join-Path $stage $relative
            $parent = Split-Path -Parent $dest
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $source -Destination $dest -Force
          }

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($shaFile, ($hash + "  " + [IO.Path]::GetFileName($zip) + "`n"), (New-Object Text.UTF8Encoding($false)))

          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$shaFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Built verified package: $zip"
          Write-Host "SHA-256: $hash"

      - name: Upload verified release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: codex-smart-factory-verified-windows
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw .\VERSION).Trim()
          $tag = "v$version"
          $notes = ".\docs\RELEASE_v$version.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes missing: $notes"
          }
          if (!(Test-Path -LiteralPath ".\distribution\ASTRA_AGI_HARNESS.cmd" -PathType Leaf)) {
            throw "One-file installer asset is missing."
          }

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it unchanged."
            exit 0
          }

          gh release create $tag `
            "$env:RELEASE_ZIP" `
            "$env:RELEASE_SHA" `
            ".\distribution\ASTRA_AGI_HARNESS.cmd" `
            --repo "${{ github.repository }}" `
            --target "$env:GITHUB_SHA" `
            --title "v$version — Astra AGI Harness for Codex Windows" `
            --notes-file $notes

          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed." }
          Write-Host "Published verified GitHub Release $tag"
